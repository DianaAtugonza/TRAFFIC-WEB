<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Traffic light background -->
  <rect width="100" height="100" fill="#1e293b" rx="10"/>
  
  <!-- Traffic light pole -->
  <rect x="42" y="25" width="16" height="50" fill="#333" rx="2"/>
  
  <!-- Red light (top) -->
  <circle cx="50" cy="35" r="10" fill="#ef4444"/>
  
  <!-- Yellow light (middle) -->
  <circle cx="50" cy="50" r="10" fill="#eab308"/>
  
  <!-- Green light (bottom) -->
  <circle cx="50" cy="65" r="10" fill="#22c55e"/>
</svg>